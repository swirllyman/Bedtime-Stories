name: Daily stories and site deploy

on:
  schedule:
    # 13:15 UTC is early morning in US Pacific time (5:15 or 6:15 depending on daylight saving).
    - cron: "15 13 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-stories
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pick tonight's stories
        # Code pushes only redeploy the site; scheduled and manual runs also pick stories.
        if: github.event_name != 'push'
        run: node scripts/rotate.mjs

      - name: Commit new stories
        if: github.event_name != 'push'
        run: |
          git config user.name "bedtime-stories-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stories
          if git diff --cached --quiet; then
            echo "No new stories to commit."
          else
            git commit -m "Pick stories for $(TZ=America/Los_Angeles date +%Y-%m-%d)"
            git push
          fi

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html style.css app.js .nojekyll _site/
          cp -r images _site/
          cp -r stories _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
